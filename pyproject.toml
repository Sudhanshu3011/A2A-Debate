[project]
name = "a2a-test"
version = "0.1.0"
description = "Adversarial Multi-Agent Debate Engine with LangGraph, LangChain, and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.20",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openrouter>=0.2.0",
    "langchain-groq>=0.2.0",
    "langsmith>=0.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
